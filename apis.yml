name: CloudSwitch
description: 'CloudSwitch was a cloud-infrastructure software startup founded in 2008 by Ellen Rubin
  and John Considine and headquartered in Burlington, Massachusetts. Its flagship product, CloudSwitch
  Enterprise, was a downloadable software appliance that installed into VMware and Xen environments and
  enabled enterprises to migrate and run existing Windows and Linux virtual machines in public clouds
  such as Amazon EC2 and Terremark without re-architecting them, preserving networking and security
  boundaries. The company raised roughly $15.4M across two rounds from Matrix Partners, Atlas Venture,
  and Commonwealth Capital Ventures, and was acquired by Verizon in August 2011 and folded into its
  Terremark cloud services unit. The company is defunct: it operates no independent website, developer
  portal, or API, so this profile remains a historical portfolio-lead stub with no live surface to
  enrich.'
